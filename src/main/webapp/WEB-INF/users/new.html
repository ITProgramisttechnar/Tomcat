<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New User</title>
</head>
<body>
<h1>Create New User</h1>
<form th:method="POST" th:action="@{/users}" th:object="${user}">
    <label for="name">Name:</label>
    <input type="text" th:field="*{name}" id="name" required/><br/>
    <label for="lastname">Last Name:</label>
    <input type="text" th:field="*{lastname}" id="lastname" required/><br/>
    <label for="age">Age:</label>
    <input type="number" th:field="*{age}" id="age" required/><br/>
    <br/>
    <input type="submit" value="Create!"/>
</form>
</body>
</html>
